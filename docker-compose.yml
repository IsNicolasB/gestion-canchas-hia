
services:
  # ========================================
  # NODO PRIMARIO (MASTER) DE MONGODB
  # ========================================
  mongo-primary:
    image: mongo:latest
    container_name: mongodb_primary_hia
    restart: always
    hostname: mongo-primary
    ports:
      - "27017:27017"
    volumes:
      - mongo_primary_data:/data/db
      - mongo_primary_config:/data/configdb
    environment:
      MONGO_INITDB_DATABASE: mi_app_db
    command: mongod --replSet rs0 --bind_ip_all --wiredTigerCacheSizeGB 2
    deploy:
      resources:
        limits:
          memory: 4g
          cpus: '2.0'
        reservations:
          memory: 2g
          cpus: '1.0'
    networks:
      - mongo-cluster
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s

  # ========================================
  # NODO SECUNDARIO 1 (RÉPLICA)
  # ========================================
  mongo-secondary1:
    image: mongo:latest
    container_name: mongodb_secondary1_hia
    restart: always
    hostname: mongo-secondary1
    ports:
      - "27018:27017"
    volumes:
      - mongo_secondary1_data:/data/db
      - mongo_secondary1_config:/data/configdb
    command: mongod --replSet rs0 --bind_ip_all --wiredTigerCacheSizeGB 1
    deploy:
      resources:
        limits:
          memory: 2g
          cpus: '1.0'
        reservations:
          memory: 1g
          cpus: '0.5'
    networks:
      - mongo-cluster
    depends_on:
      - mongo-primary
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s

  # ========================================
  # NODO SECUNDARIO 2 (RÉPLICA)
  # ========================================
  mongo-secondary2:
    image: mongo:latest
    container_name: mongodb_secondary2_hia
    restart: always
    hostname: mongo-secondary2
    ports:
      - "27019:27017"
    volumes:
      - mongo_secondary2_data:/data/db
      - mongo_secondary2_config:/data/configdb
    command: mongod --replSet rs0 --bind_ip_all --wiredTigerCacheSizeGB 1
    deploy:
      resources:
        limits:
          memory: 2g
          cpus: '1.0'
        reservations:
          memory: 1g
          cpus: '0.5'
    networks:
      - mongo-cluster
    depends_on:
      - mongo-primary
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s

  # ========================================
  # SERVICIO DE INICIALIZACIÓN DEL REPLICA SET
  # ========================================
  mongo-setup:
    image: mongo:latest
    container_name: mongodb_setup_hia
    restart: "no"
    networks:
      - mongo-cluster
    depends_on:
      mongo-primary:
        condition: service_healthy
      mongo-secondary1:
        condition: service_healthy
      mongo-secondary2:
        condition: service_healthy
    entrypoint: >
      bash -c "
        echo '⏳ Esperando estabilización...';
        sleep 10;
        
        echo '🔧 Paso 1: Iniciando Replica Set...';
        mongosh --host mongo-primary:27017 --eval '
          try {
            var config = {
              _id: \"rs0\",
              members: [
                { _id: 0, host: \"mongo-primary:27017\", priority: 2 },
                { _id: 1, host: \"mongo-secondary1:27017\", priority: 1 },
                { _id: 2, host: \"mongo-secondary2:27017\", priority: 1 }
              ]
            };
            rs.initiate(config);
            print(\"✅ Replica Set iniciado\");
          } catch(e) {
            if (e.codeName === \"AlreadyInitialized\") {
              print(\"⚠️ Replica Set ya inicializado\");
            }
          }
        ';
        
        sleep 15;
        
        echo '🔧 Paso 2: Creando usuario admin...';
        mongosh --host mongo-primary:27017 --eval '
          try {
            db.getSiblingDB(\"admin\").createUser({
              user: \"devuser\",
              pwd: \"devpass\",
              roles: [{ role: \"root\", db: \"admin\" }]
            });
            print(\"✅ Usuario admin creado\");
          } catch(e) {
            print(\"⚠️ Usuario admin ya existe\");
          }
        ';
        
        echo '🔧 Paso 3: Creando usuario PMM (SE PERSISTE)...';
        mongosh --host mongo-primary:27017 -u devuser -p devpass --authenticationDatabase admin --eval '
          try {
            db.getSiblingDB(\"admin\").createUser({
              user: \"pmm\",
              pwd: \"pmmpass\",
              roles: [
                { role: \"clusterMonitor\", db: \"admin\" },
                { role: \"read\", db: \"local\" },
                { role: \"read\", db: \"admin\" },
                { role: \"read\", db: \"config\" },
                { role: \"readAnyDatabase\", db: \"admin\" }
              ]
            });
            print(\"✅ Usuario PMM creado y persistido en volumen\");
          } catch(e) {
            print(\"⚠️ Usuario PMM ya existe (esto es BUENO)\");
          }
        ';
        
        echo '🔧 Paso 4: Habilitando profiling...';
        mongosh --host mongo-primary:27017 -u devuser -p devpass --authenticationDatabase admin --eval '
          db.getSiblingDB(\"mi_app_db\").setProfilingLevel(2, { slowms: 100 });
          print(\"✅ Profiling habilitado\");
        ';
        
        echo '✅ Configuración completada y persistida';
      "
  
  pmm-server:
    image: percona/pmm-server:2
    container_name: pmm_server_hia
    restart: always
    ports:
      - "8082:80"
    volumes:
      - pmm-server-data:/srv
    environment:
      - DISABLE_UPDATES=true
    networks:
      - mongo-cluster
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s
  
  # ========================================
  # PMM SETUP MANUAL - EJECUTAR DESPUÉS DE CAMBIAR CONTRASEÑA
  # ========================================
  pmm-setup-manual:
    image: docker:latest
    container_name: pmm_setup_manual_hia
    restart: "no"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - mongo-cluster
    depends_on:
      pmm-server:
        condition: service_healthy
      mongo-setup:
        condition: service_completed_successfully
    entrypoint: >
      sh -c "
        echo '🔧 Configurando pmm-admin...';
        docker exec pmm_server_hia pmm-admin config --server-url=https://admin:admin1234@pmm-server --server-insecure-tls;
        
        echo '🔧 Registrando MongoDB Primary...';
        docker exec pmm_server_hia pmm-admin add mongodb --username=pmm --password=pmmpass --host=mongo-primary --port=27017 --query-source=profiler --service-name=mongodb-primary-hia --replication-set=rs0 --disable-collectors='' --skip-connection-check;
        
        echo '🔧 Registrando MongoDB Secondary 1...';
        docker exec pmm_server_hia pmm-admin add mongodb --username=pmm --password=pmmpass --host=mongo-secondary1 --port=27017 --query-source=profiler --service-name=mongodb-secondary1-hia --replication-set=rs0 --disable-collectors='' --skip-connection-check;
        
        echo '🔧 Registrando MongoDB Secondary 2...';
        docker exec pmm_server_hia pmm-admin add mongodb --username=pmm --password=pmmpass --host=mongo-secondary2 --port=27017 --query-source=profiler --service-name=mongodb-secondary2-hia --replication-set=rs0 --disable-collectors='' --skip-connection-check;
        
        echo '🔧 Verificando servicios...';
        docker exec pmm_server_hia pmm-admin list;
        
        echo '✅ Configuración completada';
      "
    profiles: ["manual"]  # Solo ejecuta cuando se especifique

  # ============================================
  # MODSECURITY WAF - Firewall capa 7
  # ============================================
  waf:
    image: owasp/modsecurity-crs:nginx-alpine
    container_name: modsecurity-waf
    ports:
      - "443:8443"
    environment:
      - PARANOIA=1
      - BLOCKING_PARANOIA=1
      - ANOMALY_INBOUND=20
      - ANOMALY_OUTBOUND=5
      - PROXY_SSL_VERIFY=off
    volumes:
      - ./security/waf/default.conf.template:/etc/nginx/templates/conf.d/default.conf.template
      - ./security/waf/custom-rules.conf:/etc/modsecurity.d/custom-rules.conf:ro
      - ./logs/nginx:/var/log/nginx
      - ./security/waf/certs:/etc/nginx/certs:ro
    networks:
      - mongo-cluster
    depends_on:
      - frontend
      - backend
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1g
          cpus: '1.0'
        reservations:
          memory: 512m
          cpus: '0.5'


  frontend:
    build:
      context: frontend/
      dockerfile: Dockerfile
    container_name: frontend
    restart: always
    # Sin ports expuestos externamente (solo accesible desde WAF)
    volumes:
      - ./logs/nginx:/var/log/nginx
    depends_on:
      - backend
    deploy:
      resources:
        limits:
          memory: 1g
          cpus: '0.5'
        reservations:
          memory: 512m
          cpus: '0.25'
    networks:
      - mongo-cluster

  # ============================================
  # FAIL2BAN - Bloqueo automático de IPs
  # ============================================
  fail2ban:
    image: crazymax/fail2ban:latest
    container_name: fail2ban
    cap_add:
      - NET_ADMIN
      - NET_RAW
    environment:
      - TZ=America/Argentina/Buenos_Aires
      - F2B_LOG_LEVEL=INFO
    volumes:
      - ./security/fail2ban/data:/data
      - ./security/fail2ban/jail.d:/data/jail.d:ro
      - ./security/fail2ban/filter.d:/data/filter.d:ro
      - ./logs/nginx:/var/log/nginx:ro
    network_mode: "host"
    depends_on:
      - frontend
    restart: unless-stopped

  # ========================================
  # SERVICIO DE BACKEND (NODEJS/EXPRESS)
  # ========================================
  redis:
    image: redis:7-alpine
    container_name: redis_hia
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: >
      redis-server
      --appendonly yes
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
      --save 60 1000
      --loglevel notice
    networks:
      - mongo-cluster
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 768m
          cpus: '1.0'
        reservations:
          memory: 512m
          cpus: '0.5'
  
  mongo_backup:
      image: mongo:latest
      container_name: mongo_backup_hia
      restart: always
      depends_on:
        mongo-setup:
          condition: service_completed_successfully
      volumes:
        - ./backup:/backup
      environment:
        - TZ=America/Argentina/Jujuy
      entrypoint: >
        bash -c "
          echo '🚀 Inicializando servicio de backups...';
          
          # Actualizar e instalar dependencias
          apt-get update -qq &&
          apt-get install -y cron tzdata -qq &&
          
          # Configurar zona horaria
          ln -snf /usr/share/zoneinfo/$$TZ /etc/localtime &&
          echo $$TZ > /etc/timezone &&
          
          # Dar permisos de ejecución a los scripts
          chmod +x /backup/*.sh &&
          
          # Crear directorio de dumps si no existe
          mkdir -p /backup/dumps &&
          
          # Configurar crontab
          if [ -f /backup/crontab.txt ]; then
            cp /backup/crontab.txt /etc/cron.d/mongo-backup &&
            chmod 0644 /etc/cron.d/mongo-backup &&
            crontab /etc/cron.d/mongo-backup &&
            echo '✅ Crontab configurado correctamente';
          else
            echo '⚠️  Archivo crontab.txt no encontrado';
          fi
          
          # Crear archivo de log si no existe
          touch /backup/backup.log &&
          
          # Iniciar el servicio cron
          service cron start &&
          echo '✅ Servicio cron iniciado';
          
          # Ejecutar pruebas del sistema (opcional)
          if [ -f /backup/test_backup.sh ]; then
            echo '🧪 Ejecutando pruebas del sistema...';
            bash /backup/test_backup.sh;
          fi
          
          echo '✅ Sistema de backups operativo';
          echo '📋 Monitoreando logs...';
          echo '═══════════════════════════════════════';
          
          # Mantener el contenedor activo y mostrar logs
          tail -f /backup/backup.log
        "
      networks:
        - mongo-cluster
      deploy:
        resources:
          limits:
            memory: 1g
            cpus: '0.5'
          reservations:
            memory: 512m
            cpus: '0.25'

  backend:
    #image: nicoburgos/gestion-canchas-backend:latest
    build:
      context: backend/
      dockerfile: Dockerfile
    container_name: backend
    restart: always
    volumes:
      - ./logs/nginx:/var/log/nginx
    environment:
      MONGODB_URI: mongodb://devuser:devpass@mongo-primary:27017,mongo-secondary1:27017,mongo-secondary2:27017/mi_app_db?replicaSet=rs0&authSource=admin&retryWrites=true&w=majority
      NODE_ENV: production
    depends_on:
      mongo-setup:
        condition: service_completed_successfully
    deploy:
      resources:
        limits:
          memory: 2g
          cpus: '1.5'
        reservations:
          memory: 1g
          cpus: '0.5'
    networks:
      - mongo-cluster

  # ========================================
  # CLIENTE VISUAL (MONGO EXPRESS)
  # ========================================
  mongo-express:
    image: mongo-express:latest
    container_name: mongo_express_client_hia
    restart: always
    ports:
      - "8081:8081"
    environment:
      ME_CONFIG_MONGODB_URL: mongodb://devuser:devpass@mongo-primary:27017/?authSource=admin
      ME_CONFIG_BASICAUTH_USERNAME: admin
      ME_CONFIG_BASICAUTH_PASSWORD: password123
    depends_on:
      mongo-setup:
        condition: service_completed_successfully
    networks:
      - mongo-cluster

# ========================================
# VOLÚMENES PARA PERSISTENCIA
# ========================================
volumes:
  pmm-server-data:
    driver: local
  mongo_primary_data:
    driver: local
  mongo_primary_config:
    driver: local
  mongo_secondary1_data:
    driver: local
  mongo_secondary1_config:
    driver: local
  mongo_secondary2_data:
    driver: local
  mongo_secondary2_config:
    driver: local
  redis_data:
    driver: local

# ========================================
# RED PARA EL CLUSTER
# ========================================
networks:
  mongo-cluster:
    driver: bridge