# Reglas personalizadas para Gestión Canchas HIA

# Habilitar motor de reglas
SecRuleEngine On

# Logging
SecAuditEngine RelevantOnly
SecAuditLog /var/log/nginx/modsec_audit.log

# === Rate Limiting por IP ===
# Contador de requests por IP
SecAction "id:900001,phase:1,nolog,pass,initcol:ip=%{REMOTE_ADDR}"

# Incrementar contador
SecAction "id:900002,phase:1,nolog,pass,setvar:ip.request_counter=+1"

# Bloquear si más de 100 requests en 60 segundos
SecRule IP:REQUEST_COUNTER "@gt 100" \
    "id:900003,phase:1,deny,status:429,log,msg:'Rate limit exceeded: %{ip.request_counter} requests',\
    setvar:ip.request_counter=0"

# === Protección específica para Login ===
# Detectar múltiples intentos fallidos de login
SecRule REQUEST_URI "@streq /api/auth/login" \
    "id:900010,phase:2,pass,nolog,\
    setvar:ip.login_attempts=+1,\
    expirevar:ip.login_attempts=300"

# Bloquear después de 5 intentos en 5 minutos
SecRule IP:LOGIN_ATTEMPTS "@gt 5" \
    "id:900011,phase:1,deny,status:403,log,\
    msg:'Login brute force detected: %{ip.login_attempts} attempts',\
    setvar:ip.blocked=1,\
    expirevar:ip.blocked=3600"

# === Bloquear User-Agents maliciosos ===
SecRule REQUEST_HEADERS:User-Agent "@rx (?i)(sqlmap|nikto|nmap|masscan|nessus|openvas|metasploit)" \
    "id:900020,phase:1,deny,status:403,log,msg:'Malicious User-Agent detected: %{MATCHED_VAR}'"

# === Protección contra Path Traversal ===
SecRule REQUEST_URI "@rx \.\.\/" \
    "id:900030,phase:1,deny,status:403,log,msg:'Path traversal attempt detected'"

# === Bloquear requests sin User-Agent (bots) ===
SecRule REQUEST_HEADERS:User-Agent "@rx ^$" \
    "id:900040,phase:1,deny,status:403,log,msg:'Request without User-Agent (likely bot)'"

# === Whitelist de IPs (tu red local) ===
# Descomenta y agrega tus IPs confiables
# SecRule REMOTE_ADDR "@ipMatch 192.168.1.0/24" \
#     "id:900050,phase:1,pass,nolog,ctl:ruleEngine=Off"

# === Protección contra SQL Injection (mejorada) ===
SecRule ARGS "@detectSQLi" \
    "id:900060,phase:2,deny,status:403,log,\
    msg:'SQL Injection detected in: %{MATCHED_VAR_NAME}',\
    logdata:'Payload: %{MATCHED_VAR}',\
    severity:CRITICAL,\
    tag:'attack-sqli',\
    setvar:tx.anomaly_score=+20"

# === Protección contra XSS (mejorada) ===
SecRule ARGS "@detectXSS" \
    "id:900070,phase:2,deny,status:403,log,\
    msg:'XSS detected in: %{MATCHED_VAR_NAME}',\
    logdata:'Payload: %{MATCHED_VAR}',\
    severity:CRITICAL,\
    tag:'attack-xss',\
    setvar:tx.anomaly_score=+20"

# === Bloquear archivos peligrosos ===
SecRule REQUEST_URI "@rx \.(?:php|exe|sh|bat|cmd|asp|aspx|jsp)$" \
    "id:900080,phase:1,deny,status:403,log,\
    msg:'Dangerous file extension detected',\
    tag:'attack-rce'"

SecRule REQUEST_COOKIES:_ga_SYY5Z51JX7 ".*" "id:1000001,phase:1,pass,nolog,ctl:ruleRemoveById=932240"
SecRule REQUEST_COOKIES:g_state ".*" "id:1000002,phase:1,pass,nolog,ctl:ruleRemoveById=942200,ctl:ruleRemoveById=942340"