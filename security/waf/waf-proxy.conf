# ModSecurity WAF - Proxy hacia Frontend

upstream frontend_backend {
    server frontend:80;  # CAMBIAR de nginx a frontend
}

server {
    listen 80;
    server_name _;

    # Habilitar ModSecurity
    modsecurity on;
    modsecurity_rules_file /etc/modsecurity.d/modsecurity.conf;

    # Headers de seguridad
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Logging para Fail2Ban
    access_log /var/log/nginx/waf-access.log combined;
    error_log /var/log/nginx/waf-error.log warn;

    # Ocultar servidor
    server_tokens off;

    # Límites
    client_body_buffer_size 1M;
    client_max_body_size 10M;
    client_body_timeout 10s;
    client_header_timeout 10s;

    # Proxy a Frontend
    location / {
        proxy_pass http://frontend_backend;
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Health check
    location /health {
        access_log off;
        return 200 "WAF OK\n";
        add_header Content-Type text/plain;
    }
}